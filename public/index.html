<script type="text/plain" id="sample"># Incident report قطع اتصال DBeaver

> این متن نمونه است. آن را پاک کنید و متن خودتان را بنویسید، یا یک فایل `.md` را روی ویرایشگر رها کنید.

DBeaver بعد از قطع RDP اتصال را نگه نمی‌دارد. سطرهایی که با واژهٔ انگلیسی شروع می‌شوند هم اینجا راست‌چین می‌مانند و نقطهٔ پایان جمله سر جای درستش است.

## Timeline رخداد

- **Gateway:** اتصال‌ها در `10:05:44` بسته شدند و تا `10:05:47` برقرار نشدند.
- **RDS:** خطایی در لاگ ثبت نشد. فایل `Script-2.sql` فقط در حافظه ماند.
- `e0ad005` شناسهٔ نشستی است که بازپخش آن ۵ ثانیه طول کشید.
- **JumpServer:** نشست فعلی (`9a669e24`، از `10:18`) سالم است.
  - DBeaver هنوز در حالت «Executing» بود.
  - مسیر گزارش: Console ← Audits ← Session records

## Next steps

1. مقدار `RDS_MaxDisconnectionTime` را بیشتر کنید.
2. Keepalive را روی کلاینت فعال کنید.
3. نتیجه را با تیم DBA بررسی کنید.

- [x] بررسی لاگ‌های Gateway
- [ ] بازبینی تنظیمات Tinker

| Component | وضعیت | آخرین رخداد |
|---|---|---|
| RDS | سالم | `10:18` |
| JumpServer | نیاز به بررسی | `10:05:21` |
| Gateway | قطع شده | `10:05:44` |

```sql
-- نشست‌های فعال را پیدا کن
SELECT pid, state, query_start
FROM pg_stat_activity
WHERE state = 'active';
```

SSH و RDP هر دو از *JumpServer* می‌گذرند. مستندات: [JumpServer on GitHub](https://github.com/jumpserver/jumpserver)
