# Server block for the Docker image (also usable on any nginx host: set `root` to the public/ folder).
# Keep the CSP in sync with public/_headers, vercel.json and the <meta> tag in index.html.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Security headers. Locations below use `expires` only, so these are inherited everywhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HTML, app code and the service worker: always revalidate.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # Versioned file names: safe to cache for a year.
    location ^~ /vendor/ {
        expires 1y;
    }
    location ^~ /assets/fonts/ {
        expires 1y;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Do not serve host-specific config files.
    location = /_headers {
        return 404;
    }
}
